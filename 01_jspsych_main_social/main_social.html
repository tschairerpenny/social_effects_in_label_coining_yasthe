<!DOCTYPE html>
<html lang="de">
<!----------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
    //--------------------------------------------------------------------------------Setting up-----------------------------------------------------------------------------//
    //---------------------------------------------------------------------------------------------------------------------------------------------------------------------------//-->
<!--
    Main experiment: social influence on label adoption (two participants, two computers).
    Read README.md first - it explains the folder structure and how the two browsers communicate.

    Open main_social.html on each computer. Before handing over the computer, select the run
    type and role on the setup screens.
    Test runs never use ID management and offer a local CSV download instead of server saving.

    Implemented: startup, participant consent/demographics, Phases 1/2, and saving.
    Real runs require the infrastructure from Exp2 (README.md, "Setting up the infrastructure").
    Solo tests work without ID/saving/sync endpoints; paired tests require the PHP sync endpoint.
    Sections marked TODO are for you to implement.
-->

<head>
    <meta charset="UTF-8">
    <title>[TODO: Titel des Experiments]</title>
    <script src="https://unpkg.com/jspsych@7.2.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.2"></script>
    <script src="jspsych/plugin-html-keyboard-response.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
    <script src="jspsych/plugin-survey-text.js"></script>
    <script src="jspsych/plugin-survey.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-external-html@1.1.2"></script>
    <!-- add style sheets -->
    <link href="jspsych/jspsych.css" rel="stylesheet" type="text/css" />
    <link href="jspsych/survey.css" rel="stylesheet" type="text/css" />

    <!-- add okay and notokay functions for the informed consent page -->
    <script src="resources/informed-consent.js"></script>
    <!-- check browser -->
    <script src="resources/browserCheck.js"></script>
    <!-- all changeable parameters (conditions, timing, trial numbers, confederate behaviour) -->
    <script src="resources/experiment_config.js"></script>
    <!-- Browser-readable copy of concepts.csv for solo tests opened as a local file. -->
    <script src="stimuli/concepts.js"></script>
    <!-- communication with the partner's browser - the ONLY place that talks to sync/sync.php -->
    <script src="resources/pair_sync.js"></script>
    <script src="resources/phase1.js"></script>
    <script src="resources/phase2.js"></script>
    <script src="resources/experiment_setup.js"></script>
    <style>
        [hidden] { display: none !important; }
        #experiment-setup { max-width: 720px; margin: 48px auto; padding: 24px; font: 18px/1.6 sans-serif; }
        #experiment-setup h1 { font-size: 28px; }
        #experiment-setup h2 { font-size: 22px; }
        #experiment-setup fieldset { margin: 20px 0; padding: 16px; }
        #experiment-setup fieldset label { display: block; margin: 8px 0; }
        #experiment-setup button, #experiment-setup select, #experiment-setup input[type="text"] {
            font: inherit; padding: 8px 12px; margin: 4px;
        }
        #experiment-setup small { display: block; }
        #setup-error { color: #a01919; }
        #test-mode-banner { position: fixed; top: 0; left: 0; right: 0; z-index: 10000;
            background: #fff0be; color: #563600; padding: 6px; text-align: center; font: bold 14px sans-serif; }
        .phase1-stage, .phase1-instructions { max-width: 900px; margin: 32px auto; padding: 12px; }
        .phase1-instructions { text-align: left; line-height: 1.6; }
        .phase1-stage h2 { font-size: 24px; margin: 8px; }
        .phase1-stage p { margin: 8px 0; }
        .phase1-counter { font-size: 15px; }
        .phase1-image { width: clamp(200px, 30vh, 320px); height: clamp(200px, 30vh, 320px); object-fit: contain; }
        .phase1-guidance:not(:empty) { background: #fff0be; border-left: 4px solid #a46b00; padding: 8px 16px; text-align: left; }
        .phase1-labels { font-size: 20px; }
        .phase1-controls label { display: block; }
        .phase1-controls input[type="text"] { width: min(90%, 420px); padding: 8px; font: inherit; margin: 8px; }
        .phase1-controls .jspsych-btn { margin: 8px; white-space: normal; max-width: 100%; }
        .phase2-stage, .phase2-instructions { max-width: 900px; margin: 32px auto; padding: 12px; }
        .phase2-instructions { text-align: left; line-height: 1.6; }
        .phase2-stage h2 { font-size: 24px; margin: 8px; }
        .phase2-stage p { margin: 8px 0; }
        .phase2-counter { font-size: 15px; }
        .phase2-image { width: clamp(200px, 30vh, 320px); height: clamp(200px, 30vh, 320px); object-fit: contain; }
        .phase2-guidance:not(:empty) { background: #fff0be; border-left: 4px solid #a46b00; padding: 8px 16px; text-align: left; }
        .phase2-submitted-label { font-size: 22px; overflow-wrap: anywhere; }
        .phase2-controls label { display: block; }
        .phase2-controls input[type="text"] { width: min(90%, 420px); padding: 8px; font: inherit; margin: 8px; }
        .phase2-controls .jspsych-btn { margin: 8px; }
        .phase2-controls .jspsych-btn:disabled { opacity: 0.45; cursor: default; }
        .phase2-feedback { font-size: 24px; font-weight: bold; }
        .phase2-feedback[data-correct="true"] { color: #176b34; }
        .phase2-feedback[data-correct="false"] { color: #a01919; }
    </style>
</head>

<body>
    <main id="experiment-setup" lang="en"></main>
    <aside id="test-mode-banner" lang="en" hidden></aside>
    <main id="experiment" hidden></main>
</body>

<script>
    // Initialized only after the experimenter has completed setup.
    var jsPsych;

    //-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
    //----------------------0. Test mode, role, pair ID and condition--------------------------------------------------------------------------------------------------------------//
    //---------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
    var LIVE_PATHS = {
        manageID: 'ID_management/manageID_social.php',
        cleanupID: 'ID_management/cleanupID_social.php',
        saveData: 'save_data.php',
        filePrefix: 'social_',
    };

    async function postText(url, data) {
        var response = await fetch(url, {
            method: 'POST',
            body: new URLSearchParams(data),
            cache: 'no-store',
            signal: AbortSignal.timeout(15000),
        });
        if (!response.ok) throw new Error('Server request failed: ' + url + ' (' + response.status + ').');
        return (await response.text()).trim();
    }

    async function startExperiment(settings) {
        var TEST_MODE = settings.testMode;
        var PATHS = LIVE_PATHS;
        var role = settings.role; // retain 'naive' internally; display 'Participant' during setup
        var localPreview = location.protocol === 'file:';
        if (localPreview && (!TEST_MODE || !settings.solo)) {
            throw new Error('Real sessions and two-browser tests require a PHP server. Open the experiment through HTTP or HTTPS, or select Test run and Test alone.');
        }
        var consentAvailable = false;
        if (role === 'naive' && !localPreview) {
            try {
                var consentResponse = await fetch('resources/informedconsent_social_de.html', {
                    cache: 'no-store', signal: AbortSignal.timeout(15000),
                });
                consentAvailable = consentResponse.ok;
            } catch (error) {
                // A participant test can run without the still-missing consent form.
            }
            if (!TEST_MODE && !consentAvailable) {
                throw new Error('The consent form is missing or could not be loaded. Please provide resources/informedconsent_social_de.html.');
            }
        }

        var pairID = null; // test sessions do not have a research pair ID
        var sessionID;
        var condition;
        if (TEST_MODE) {
            sessionID = settings.solo || role === 'naive' ? ExperimentSetup.createTestSession() : settings.pair;
            condition = settings.condition;
        } else {
            var ID = role === 'naive' ? await postText(PATHS.manageID, {}) : settings.pair;
            if (!ID) throw new Error('Data collection is closed: no pair IDs are available.');
            if (!/^[1-9][0-9]*$/.test(ID) || !Number.isSafeInteger(Number(ID))) {
                throw new Error('ID management did not return a valid positive pair ID. Please check the server configuration.');
            }
            pairID = Number(ID);
            sessionID = String(pairID);
            condition = getCondition(pairID);
        }
        var metadata = await PairSync.join(sessionID, role, {
            testMode: TEST_MODE,
            solo: settings.solo,
            condition: condition,
            simulatePartner: CONFIG.testing.partnerValue,
        });
        condition = metadata.condition; // paired test confederate inherits the participant's choice
        if (!CONFIG.conditions.includes(condition)) throw new Error('Unknown session condition. Please check the configuration on both computers.');
        var phase1 = await Phase1.prepare(settings, condition);
        var phase2 = await Phase2.prepare(phase1, settings);

        jsPsych = initJsPsych({ display_element: 'experiment' });
        document.getElementById('experiment').hidden = false;
        document.getElementById('experiment').lang = role === 'naive' ? 'de' : 'en';
        if (TEST_MODE) {
            var banner = document.getElementById('test-mode-banner');
            banner.textContent = 'TEST RUN · ' + (settings.solo ? 'Simulated partner' : 'Two browsers') + ' · ' + sessionID;
            banner.hidden = false;
        }

        // these columns are added to every row of the data file
        jsPsych.data.addProperties({
            pair_id: pairID,
            session_id: sessionID,
            role: role,
            condition: condition,
            test_mode: TEST_MODE,
            connection_mode: settings.solo ? 'solo' : 'paired',
        });

        // Shown only to the experimenter before the participant sits down: the pair ID that has to
        // be entered on the confederate's setup screen (a temporary session code for paired tests).
        var experimenter_screen = {
            type: jsPsychHtmlButtonResponse,
            stimulus: '<div lang="en"><p>' + (TEST_MODE ? 'Test session' : 'Pair ID') + ': <b>' + sessionID +
                '</b></p><p>Role: <b>' + (role === 'naive' ? 'Participant' : 'Confederate') +
                '</b> | Condition: <b>' + CONFIG.condition_labels[condition] + '</b></p>' +
                (TEST_MODE && settings.solo ? '<p>The partner is simulated for this test.</p>' :
                    '<p>Enter the same ' + (TEST_MODE ? 'test session code' : 'pair ID') + ' on the other computer.</p>') + '</div>',
            choices: ['Start'],
            data: { phase: 'setup' },
        };

        //-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        //----------------------1. Welcome and consent--------------------------------------------------------------------------------------------------------------------------------//
        //---------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        var enter_fullscreen = {
            type: jsPsychFullscreen,
            fullscreen_mode: true,
            message: role === 'naive' ? '<p><i>Das Experiment wechselt in den Vollbildmodus.</i></p>' :
                '<p><i>The experiment will enter fullscreen mode.</i></p>',
            button_label: role === 'naive' ? 'Starten' : 'Start experiment',
        };

        // TODO: adapt the text of resources/informedconsent_social_de.html (see the TODOs in that file)
        var informed_consent = {
            type: jsPsychExternalHtml,
            url: "resources/informedconsent_social_de.html",
            cont_btn: "start",
            data: { phase: 'consent' },
        };
        if (TEST_MODE && !consentAvailable) {
            informed_consent = {
                type: jsPsychHtmlButtonResponse,
                stimulus: '<div lang="en"><p><b>Test run: consent is unavailable in this preview.</b></p>' +
                    '<p>This placeholder appears only in test runs.</p></div>',
                choices: ['Continue test'],
                data: { phase: 'consent_test_placeholder' },
            };
        }

        // The selected stimulus images were preloaded by Phase1.prepare() during setup.

        //-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        //------------------2. Demographics--------------------------------------------------------------------------------------------------------------------------------------------//
        //---------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        // Use the pages/prompt/required API supported by the bundled plugin-survey.js.
        // Participant only, in both real and test runs; names match the pre-studies.
        var demographics = {
            type: jsPsychSurvey,
            data: { phase: 'demographics' },
            button_label_finish: 'Weiter',
            required_error_text: 'Bitte beantworten Sie diese Frage.',
            pages: [[
                {
                    type: 'html',
                    prompt: '<p><b>Vielen Dank für Ihre Teilnahme an unserem Experiment!</b></p>' +
                        '<p>Bevor Sie mit den Anweisungen fortfahren, benötigen wir noch ein paar Angaben zu Ihrer Person. Diese Angaben bleiben anonym.</p>',
                },
                {
                    type: 'text',
                    prompt: 'Ihr Alter (in Jahren):',
                    name: 'age',
                    required: true,
                    input_type: 'number',
                },
                {
                    type: 'text',
                    prompt: 'Ihr Geschlecht:',
                    name: 'gender',
                    required: true,
                },
                {
                    type: 'multi-choice',
                    prompt: 'Sind Sie einsprachig mit Deutsch als einzige Muttersprache aufgewachsen?',
                    options: ['Ja', 'Nein'],
                    name: 'monolingual_german',
                    required: true,
                },
                {
                    type: 'text',
                    prompt: 'Ihre Muttersprache(n):',
                    name: 'nat_lang',
                    required: true,
                },
            ]],
        };

        var instruction1 = {
            type: jsPsychHtmlButtonResponse,
            stimulus: '<div style="text-align:left;">' +
                '<p align="center"><b>Um Ihre Konzentration sicherzustellen:</b> </p>' +
                '<t>&nbsp;&nbsp;&nbsp;&nbsp;&bull;<b> schalten Sie Musik</b>/Audio aus, das Sie möglicherweise hören,</p>&nbsp;&nbsp;&nbsp;&nbsp;&bull;' +
                '<b> verzichten Sie auf das Googeln</b> oder Nachschlagen von Informationen während des Experiments,</p><t>&nbsp;&nbsp;&nbsp;&nbsp;&bull;' +
                ' stellen Sie Ihr <b>Telefon auf lautlos</b> und legen Sie es mit dem Display nach unten oder außer Reichweite,</p><t>&nbsp;&nbsp;&nbsp;&nbsp;&bull;' +
                '<b> bleiben Sie bis zum Ende beim Experiment.</b>,</p><t>&nbsp;&nbsp;&nbsp;&nbsp;&bull;' +
                '<p align="left">Diese Schritte helfen uns, qualitativ hochwertige Daten zu erheben.</p><br>' +
                '<p align="center"><b> Bitte drücken Sie "Weiter", wenn Sie damit einverstanden sind.</b></p>',
            choices: ['Weiter']
        };

        //-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        //------------------3. Phase 1 - Grounding (shared)----------------------------------------------------------------------------------------------------------------------------//
        //---------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        // Phase1.prepare() loads the CSV, samples a shared 16-picture plan, assigns the
        // confederate's labels/filler strategies, and preloads images before the experiment.
        // Its timeline follows participant-only consent/demographics below. Phase 1 responses
        // are in phase1.results and the jsPsych data, available to the later phases.

        //-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        //------------------4. Phase 2 - Sender-receiver picture selection (shared)----------------------------------------------------------------------------------------------------//
        //---------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        // Phase 2 reuses the Phase 1 order, filler flags, and actual submitted confederate labels.
        // Each label attempt produces its own data row; successful feedback skips later attempts.
        // phase2.results retains these rows for analysis and the future Phase 3 implementation.

        //-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        //------------------5. Phase 3 - Private naming (naive participant only)-------------------------------------------------------------------------------------------------------//
        //---------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        /* TODO: "Welche Bezeichnung beschreibt dieses Konzept am besten?" for each concept, no
           communication with the partner. Main dependent variable: whether the answer equals the
           confederate's label from phase 1 (store confederate_label in the data of each trial). */

        //---------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        //--------------------------------6. Post-experiment questionnaire--------------------------------------------------------------------------------------------------------------//
        //---------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        /* TODO: build a jsPsychSurveyText trial (plugin-survey-text.js) called "questionnaire",
           preceded by a short html-button-response screen ("Das war die Hauptaufgabe! ..."), as in Exp2.
           Questions (all required), same names as Exp1/Exp2 so the data can be compared:
             - attention     "Haben Sie der Studie aufmerksam gefolgt?"
             - strategies    "Welche Strategien haben Sie verwendet, um ... ?" (adapt to the tasks)
             - notice        "Ist Ihnen während des Experiments etwas aufgefallen? Irgendetwas Merkwürdiges oder Überraschendes?"
           Additional questions for this study (confederate design):
             - suspicion     whether they believed the other person was a real, naive participant
                             (ask open-ended first, then directly - "funnel debriefing")
             - partner_impression   how they perceived the other participant (e.g. competent, likeable)
           Only the naive participant needs the questionnaire; skip it for role === 'confederate'
           (use a conditional timeline: { timeline: [...], conditional_function: ... }).
           After the questionnaire, the experimenter does the verbal debriefing (reveal the confederate). */

        //---------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        //------------------------------------------------7. Save data and free the ID-----------------------------------------------------------------------------------------------//
        //---------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        // One file per participant, e.g. data/social_12_naive_1760000000000.csv and
        // data/social_12_confederate_1760000000000.csv - merge the two by pair_id in the analysis.
        // Test data stays in the browser and can be downloaded on the final screen.
        // TODO: consider also saving after each phase, so a crash in phase 3 does not lose phases 1-2.
        var testDownloadURL;
        var dataFilename;
        var save_data_block = {
            type: jsPsychCallFunction,
            async: true,
            func: function (done) {
                dataFilename = (TEST_MODE ? 'TEST_social_' : PATHS.filePrefix) + sessionID + '_' + role + '_' + Date.now() + '.csv';
                var csv = jsPsych.data.get().csv();
                if (TEST_MODE) {
                    testDownloadURL = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
                    done();
                    return;
                }
                var saved = false;
                async function saveAndCleanup() {
                    var display = jsPsych.getDisplayElement();
                    display.innerHTML = role === 'naive' ? '<p>Daten werden gespeichert …</p>' : '<p>Saving data …</p>';
                    try {
                        if (!saved) {
                            await postText(PATHS.saveData, { filename: dataFilename, filedata: csv });
                            saved = true;
                        }
                        // Never called in test mode; only the real participant frees the pair ID.
                        if (role === 'naive') await postText(PATHS.cleanupID, { ID: pairID });
                        done();
                    } catch (error) {
                        display.innerHTML = '<p role="alert"></p><button type="button">' + (role === 'naive' ? 'Erneut versuchen' : 'Try again') + '</button>';
                        display.querySelector('p').textContent = (role === 'naive' ?
                            'Speichern oder ID-Abschluss fehlgeschlagen. Bitte die Versuchsleitung informieren. ' :
                            'Saving or ID cleanup failed. Please inform the experimenter. ') + error.message;
                        display.querySelector('button').addEventListener('click', saveAndCleanup, { once: true });
                    }
                }
                saveAndCleanup();
            },
        };

        var exit_fullscreen = {
            type: jsPsychFullscreen,
            fullscreen_mode: false,
            delay_after: 0
        };

        var final = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: (role === 'naive' ? '<p><b>Vielen Dank für Ihre Teilnahme!</b></p>' +
                '<p>Bitte wenden Sie sich an die Versuchsleitung.</p>' :
                '<p><b>Your part is complete.</b></p><p>Please contact the experimenter.</p>') +
                (TEST_MODE ? '<div lang="en"><p>Test data was not saved to the server.</p><a id="test-data-download">Download test data (CSV)</a></div>' : ''),
            choices: "NO_KEYS",
            on_load: function () {
                if (TEST_MODE) {
                    var link = document.getElementById('test-data-download');
                    link.href = testDownloadURL;
                    link.download = dataFilename;
                }
            },
        };

        //---------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        //------------------------------------------------8. Timeline-------------------------------------------------------------------------------------------------------------------//
        //---------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        var timeline = [
            experimenter_screen,
            enter_fullscreen,
            {
                timeline: [informed_consent, demographics],
                conditional_function: function () { return role === 'naive'; },
            },
            { timeline: phase1.timeline() },
            { timeline: phase2.timeline() },
            // TODO: phase 3,
            // TODO: questionnaire (naive participant only),
            save_data_block,
            exit_fullscreen,
            final
        ];

        /* start the experiment */
        jsPsych.run(timeline);
    }

    ExperimentSetup.mount(document.getElementById('experiment-setup'), startExperiment);
</script>

</html>
